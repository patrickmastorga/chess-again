[package]
name = "chess-again-network"
version.workspace = true
edition.workspace = true

[dependencies]
chess-again-core = { workspace = true }
burn = { workspace = true, features = ["std", "flex"] }

[features]
default = []
metal  = ["burn/metal", "burn/fusion", "burn/autotune"]
cuda   = ["burn/cuda", "burn/fusion", "burn/autotune"]
webgpu = ["burn/webgpu", "burn/fusion", "burn/autotune"]