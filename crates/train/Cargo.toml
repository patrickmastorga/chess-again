[package]
name = "chess-again-train"
version.workspace = true
edition.workspace = true

[dependencies]
chess-again-core = { workspace = true }
chess-again-network = { workspace = true }
chess-again-dataset = { workspace = true }
anyhow = { workspace = true }
burn = { workspace = true, features = ["std", "train", "dataset", "tui"] }

[[bin]]
name = "v1_2m_pretrain"
path = "src/bin/v1_2M_pretrain.rs"

# Run on Cluster with CUDA
[[bin]]
name = "v1_20M_pretrain"
path = "src/bin/v1_20M_pretrain.rs"
required-features = ["cuda"]

[features]
default = []
metal  = ["chess-again-network/metal"]
cuda   = ["chess-again-network/cuda"]
webgpu = ["chess-again-network/webgpu"]